<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111316"><title>Badge Lab · 星火奖</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="./badge-lab.css">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
<header class="lab-header"><div><span class="logo">✧</span><strong>Badge Lab</strong><span class="project">SPARK AWARD</span></div><a href="./index.html" target="_blank" rel="noopener">打开解锁页 ↗</a></header>
<main>
<section class="viewport" aria-label="徽章 3D 调试视图">
<div class="view-toolbar" role="group" aria-label="固定视角"><button data-view="front" aria-pressed="true">正视</button><button data-view="side" aria-pressed="false">侧视</button><button data-view="back" aria-pressed="false">背视</button><button data-view="perspective" aria-pressed="false">透视</button></div>
<canvas id="lab-scene" tabindex="0" aria-label="拖动旋转，滚轮缩放，右键拖动平移；1 正视、2 侧视、3 背视、4 透视"></canvas>
<div class="viewport-footer"><span>拖动旋转 · 滚轮缩放 · 右键平移</span><span id="dimensions">—</span></div>
<p id="loading" role="status">正在生成徽章…</p>
</section>
<aside class="inspector" aria-label="模型参数">
<section><div class="section-heading"><h1>模型参数</h1><span id="dirty" class="pill">已应用</span></div><p class="muted">保留的 SVG 几何编辑器；正式页面现已使用 GLB。</p></section>
<section><h2>源文件</h2><code>assets/badge.svg</code><button id="reload" class="wide">↻ 重新加载 SVG</button><p class="hint">直接替换项目中的 SVG 后重新加载。原版徽章沿用已修正的背面文件。</p></section>
<section><h2>几何</h2>
<label class="range-label" for="thickness">基底厚度 <output id="thickness-value"></output></label><input id="thickness" type="range" min="0.025" max="0.5" step="0.001">
<label class="range-label" for="bevel">倒角倍率 <output id="bevel-value"></output></label><input id="bevel" type="range" min="0" max="2" step="0.05">
<label class="range-label" for="relief">浮雕深度 <output id="relief-value"></output></label><input id="relief" type="range" min="0.25" max="3" step="0.05">
</section>
<section><h2>材质</h2><label class="sr-only" for="material-role">材质区域</label><select id="material-role"><option value="star">正面星形</option><option value="inset">正面背景</option><option value="body">金属基底</option><option value="edge">外缘</option><option value="rim">正面边框</option><option value="starEdge">星形倒角</option><option value="starHighlight">星形高光线</option><option value="letters">正面文字</option><option value="reverse">背面底板</option><option value="reverseLetters">背面文字</option></select>
<label class="range-label" for="metalness">金属度 <output id="metalness-value"></output></label><input id="metalness" type="range" min="0" max="1" step="0.01">
<label class="range-label" for="roughness">粗糙度 <output id="roughness-value"></output></label><input id="roughness" type="range" min="0" max="1" step="0.01">
</section>
<section><h2>辅助显示</h2><label class="toggle"><span>坐标轴 <small>X / Y / Z</small></span><input id="axes" type="checkbox"></label><label class="toggle"><span>包围盒 <small>BoundingBox</small></span><input id="bounds" type="checkbox"></label><p class="hint">白光与正式页一致。辅助线仅在此页显示。</p></section>
<section class="apply-section"><button id="apply" class="primary wide">保存 SVG 参数</button><div class="button-row"><button id="export">导出配置</button><button id="defaults">恢复默认</button></div><p class="hint">应用后刷新此 SVG 编辑器。要让其他设备也使用此配置，导出并替换项目的 Badge3DConfig.js。</p><p id="lab-status" role="status" aria-live="polite"></p></section>
</aside>
</main>
<script type="module" src="./badge-svg-lab.js"></script>
</body></html>
