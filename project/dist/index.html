<body>
<main class="award-screen unlock-active" data-unlock-state="IDLE" data-unlock-ready="false">
<p id="preload-hint" class="sr-only" role="status">正在准备你的星火奖…</p>
<section id="stage" aria-label="金属徽章，拖动旋转，方向键旋转，Home 键回正">
<canvas id="scene" tabindex="0" aria-label="拖动或使用方向键旋转徽章"></canvas>
<div id="fallback" hidden><img src="./assets/badge-fallback.svg" alt="原始徽章设计"></div>

</section>
<section inert class="award-copy" aria-labelledby="award-title">
<h1 id="award-title">星火奖</h1>
<p class="award-message"><span>您的模型累计被打印 100,000 次!</span><br>恭喜获得<span class="award-name">「星火奖」</span></p>
<p class="award-date"><span>获得日期</span><time id="award-date"></time></p>
</section>
<div inert class="award-actions" aria-label="奖项操作">
<button class="glass-button share-button" id="share-award" disabled type="button">
<img class="share-icon" src="./assets/ui/share.svg" width="20" height="20" alt="" aria-hidden="true">
<span>分享</span>
</button>
<button class="glass-button confirm-button" id="confirm-award" disabled type="button">
<svg class="confirmation-check" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden><path d="m5 12 4.5 4.5L19 7"/></svg>
<span>确认</span>
</button>
</div>
<div class="controls" role="group" aria-label="徽章视角控制">
<button id="rotate" aria-label="开始自动旋转" aria-pressed="false"><img src="./assets/ui/controls.svg" alt="" aria-hidden="true"></button>
<button id="reset" aria-label="回正"><img src="./assets/ui/controls.svg" alt="" aria-hidden="true"></button>
</div>
<p id="action-status" class="action-status" role="status" aria-live="polite"></p>
</main>
<script src="./vendor/gsap.min.js"></script>
<script type="module" src="./app.js"></script>
